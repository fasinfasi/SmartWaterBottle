name: aquasync
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2 # Added http package for API calls
  flutter_spinkit: ^5.2.1 # Added flutter_spinkit package for loading animations
  intl: ^0.18.0 # Added intl package for date formatting
  flutter_blue_plus: ^1.3.0
  permission_handler: ^10.2.0 # Ensure you're using the latest version
  flutter_screenutil: ^5.0.0+2 # Add this line for screenutil package
  platform: ^3.0.0
  geolocator: ^9.0.2 # Check for the latest version on pub.dev
  flutter_secure_storage: ^8.0.0
  socket_io_client: ^2.0.0
  fl_chart: ^0.70.0
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0 # Ensure this line is included
  flutter_launcher_icons: ^0.14.2 # Added flutter_launcher_icons package for icon generation

flutter:
  uses-material-design: true

  assets:
    - assets/water_bottle_logo_welcome_page.png
    - assets/google_logo.png
    - assets/simplebottle.png
    - assets/BottleIconBluetooth.png
    - assets/bar_chart.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/water_bottle_logo_welcome_page.png" # Path to your icon image
